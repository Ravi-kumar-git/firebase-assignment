<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            padding: 5rem;
            background-color: #8EC5FC;
            background-image: linear-gradient(62deg, #8EC5FC 0%, #E0C3FC 100%);
        }

        div {
            border: 1px solid rgb(233, 225, 225);
            width: fit-content;
            padding: 2rem;
            text-align: center;
            background-color: #8EC5FC;
            background-image: linear-gradient(62deg, #8EC5FC 0%, #E0C3FC 100%);
            border-radius: 20px;
        }

        input {
            font-size: 1.2rem;
            padding: 0.5rem;
        }
    </style>
</head>

<body>
    <div>
        <h2>Register Page</h2>
        <form action="./login.html" method="">

            <input type="text" id="email" name="email" placeholder="Enter Email" required
                pattern="[a-zA-Z0-9]+@(gmail|yahoo|outlook)+(.in|.org|.com)">
            <br><br>
            <input type="password" id="password" name="password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[\d]).{4,8}"
                placeholder="Enter Passward">
            <br><br>
            <!-- <input type="text" required pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[\d]).{4,8}" placeholder="re-enter Passward"><br><br> -->

            <input type="submit" id="signUp" name="signUp" value="Sign up">
        </form>
    </div>

</body>

</html>
