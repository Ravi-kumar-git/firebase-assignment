<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-items: center;
        }

        .container {
            max-width:90%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        h1 {
            text-align: center;
        }

        .contain {
            height: 60vh;
            width: 27vw;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-items: center;
        }

        .contained {
            height: 80%;
            width: 80%;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h3 {
            font-weight: 400;
            margin: 10px 0;
            font-size: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        p{
            font-size: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        @media screen and (max-width: 1000px) {
            .container {
            grid-template-columns: repeat(2, 1fr);
            }
            .contain {
            width: 45vw;
           }
        }
        @media screen and (max-width: 820px) {
            .container {
                max-width:100%;
            }  
        }
        
        @media screen and (max-width: 735px) {
            .container {
                max-width:100%;
            grid-template-columns: repeat(1, 1fr);
            }
            .contain {
            width: 70vw;
           }
        }
        
        @media screen and (max-width: 550px) {
            .container {
                max-width:100%;
            grid-template-columns: repeat(1, 1fr);
            gap: 2rem;
            }
            .contain {
            width: 90vw;
           }
        }
        
    </style>
</head>

<body>
    <br>
    <h1>Food</h1>
    <br><br><br><br><br>
    <script src="./food.js"></script>
</body>

</html>
